<circle cx="1010" cy="400" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="441" x2="1044" y2="441" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="461" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:车站</text>
