<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-06 窗口聚合出指标 · 鲁棒图（实时计算模块 stream/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-06 基本流 1—6；03-用例图-实时计算.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    计算进程 @(100,300)
    boundary cli   :队列连接 @(360,300)
    control  svc   :窗口聚合服务 @(700,300)
    entity   ev    :闸机事件 @(1010,160)
    entity   st    :车站 @(1010,400)
    entity   win   :客流窗口 @(1010,640)
  边清单
    计算进程 → :队列连接  1：“触发一轮聚合”
    :队列连接 → :窗口聚合服务  1.1：取一批事件（扇形展开 -6°）
    :窗口聚合服务 → :闸机事件  3.1：按窗口分拣
    :窗口聚合服务 → :车站  5.1：按站点累加
    :窗口聚合服务 → :客流窗口  6.1：«create» 指标对象
  覆盖：基本流 1—6 全部活动；备选流 A1（本窗口无事件仍产出全 0 指标）含在 6.1；异常流 E1（暂存队列超限）见图注
  假设：UC-07 被本用例 include，其判定细节见 25 号图，本图不重复展开
  假设：实体 :客流窗口 由 6.1 «create» 产生，是后续 UC-08 的输入
  假设：2.1 对齐整秒、4.1 暂存后续窗口事件均为控制内部处理，不产生组件间消息
-->
<rect x="0" y="0" width="1200" height="790" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-06 窗口聚合出指标 · 鲁棒图（实时计算模块 stream/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">1 秒翻滚窗口向下对齐整秒；含 UC-07（事件校验），校验用例另见 25 号图</text>
