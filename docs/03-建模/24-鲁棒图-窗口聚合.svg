<line x1="722.9" y1="325.1" x2="987.1" y2="614.9" stroke="#2b2b2b" stroke-width="1.8"/><path d="M987.1,614.9 L976.4,609.8 L983.0,603.7 Z" fill="#2b2b2b"/>
<g><rect x="154.7" y="287.0" width="134.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“触发一轮聚合”</text>
<g><rect x="474.1" y="287.0" width="111.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="530.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：取一批事件</text>
<g><rect x="799.1" y="217.0" width="111.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="234.3" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：按窗口分拣</text>
<g><rect x="786.8" y="333.0" width="111.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="842.7" y="350.4" text-anchor="middle" font-size="12" fill="#2b2b2b">5.1：按站点累加</text>
<g><rect x="770.0" y="457.0" width="170.0" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="474.3" text-anchor="middle" font-size="12" fill="#2b2b2b">6.1：«create» 指标对象</text>
<text x="40" y="734" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶三角 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="760" font-size="12.5" fill="#5a6472">备选流 A1：本窗口无有效事件时仍产出全 0 指标，用于维持快照存活；异常流 E1：暂存队列超上限时只保留最近一批。</text>
</svg>
