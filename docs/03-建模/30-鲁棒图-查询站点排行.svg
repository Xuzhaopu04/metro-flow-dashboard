<line x1="733.2" y1="367.5" x2="976.8" y2="422.5" stroke="#2b2b2b" stroke-width="1.8"/><path d="M976.8,422.5 L965.1,424.5 L967.1,415.7 Z" fill="#2b2b2b"/>
<g><rect x="158.5" y="288.0" width="124.4" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="220.7" y="305.4" text-anchor="middle" font-size="12" fill="#2b2b2b">1：GET /api/rank</text>
<g><rect x="146.8" y="406.0" width="147.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="220.7" y="423.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.0：“查看排行列表”</text>
<g><rect x="436.8" y="329.4" width="159.2" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="516.4" y="346.7" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：校验 top 在 1—20</text>
<g><rect x="491.6" y="363.9" width="164.0" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="573.6" y="381.2" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：400 INVALID_PARAM</text>
<g><rect x="789.2" y="252.0" width="131.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="269.3" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：取最近 5 分钟</text>
<g><rect x="758.8" y="379.8" width="173.0" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="845.3" y="397.1" text-anchor="middle" font-size="12" fill="#2b2b2b">4.1：按站点求和降序取前 N</text>
<text x="40" y="744" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶弧 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="770" font-size="12.5" fill="#5a6472">缺省 top=5，取值 1—20；窗口内无数据时返回空 top 数组与 200；参数越界返回 400 INVALID_PARAM。</text>
</svg>
