<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-12 查询站点排行 · 鲁棒图（数据服务模块 api/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-12 主事件流 1—4；04-用例图-数据服务.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    值班主管 @(100,250)
    actor    op2   大屏页面 @(100,470)
    boundary cli   :HTTP 接口 @(360,360)
    control  svc   :排行查询服务 @(700,360)
    entity   win   :客流窗口 @(1010,170)
    entity   st    :车站 @(1010,430)
    external db    :指标库 MySQL @(1010,660)
  边清单
    值班主管 → :HTTP 接口  1：GET /api/rank
    大屏页面 → :HTTP 接口  1.0：“查看排行列表”
    :HTTP 接口 → :排行查询服务  1.1：校验 top 在 1—20（扇形展开 -6°）
    :排行查询服务 → :HTTP 接口  2.1：400 INVALID_PARAM（扇形展开 6°）
    :排行查询服务 → :客流窗口  3.1：取最近 5 分钟
    :排行查询服务 → :车站  4.1：按站点求和降序取前 N
  覆盖：主事件流 1—4 全部活动；可选事件流 A1（不传 top 默认前 5）、A2（窗口内无数据返回空数组）、E1（参数非法）分别含在 1.1 / 2.1 / 4.2
  假设：5 分钟窗口是业务常量而非实体：不建「统计窗口」类，与用例表「假设统计窗口固定」一致
  假设：与 UC-11 同口径：同一时间窗内排行累计应与序列累计可对账
  假设：4.2「取前 N」是控制内部排序截断，并入 4.1
-->
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-12 查询站点排行 · 鲁棒图（数据服务模块 api/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">统计窗口固定 5 分钟、不做参数化，只有 top 可调</text>
