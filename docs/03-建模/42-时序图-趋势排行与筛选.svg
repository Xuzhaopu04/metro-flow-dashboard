<!--
  产物头（由同名 .puml 的头部注释原样带入）
  产物：UC-15 按线路筛选 + UC-16 查看趋势与排行 序列图（时序图）
  规范：se-sequence-diagram §4 符号、§5 三步转换、§6 命名与编号、references/03 固定参数
  上游：33/34-鲁棒图（对象名逐字沿用）；用例表 UC-15 / UC-16
  覆盖：UC-15 基本流 1—3；UC-16 基本流 1—3
  假设：A1 UC-15 是 UC-14 的扩展：先由筛选改条件，再由 UC-16 的 5 秒轮询取数，两段用 == 分节
  A2 筛选是本地过滤，不新增接口调用；故 UC-15 段里没有到 :数据服务模块 的消息
  A3 UC-16 备选流 A1（历史接口失败保留上一轮图形）用 alt 的失败分区表达
-->
