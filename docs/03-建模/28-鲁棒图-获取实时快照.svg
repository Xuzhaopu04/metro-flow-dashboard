<line x1="731.7" y1="372.3" x2="914.4" y2="443.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M914.4,443.0 L902.5,443.2 L905.8,434.8 Z" fill="#2b2b2b"/>
<line x1="730.2" y1="344.4" x2="979.8" y2="215.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M979.8,215.6 L972.1,224.6 L967.9,216.6 Z" fill="#2b2b2b"/>
<g><rect x="145.3" y="288.0" width="150.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="220.7" y="305.4" text-anchor="middle" font-size="12" fill="#2b2b2b">1：GET /api/snapshot</text>
<g><rect x="146.8" y="406.0" width="147.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="220.7" y="423.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.0：“查看看板数字”</text>
<g><rect x="432.7" y="332.0" width="194.6" height="56" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="530.0" y="349.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：解析请求</text>
<text x="530.0" y="364.3" text-anchor="middle" font-size="12" fill="#2b2b2b">2.3：空则回空结构</text>
<text x="530.0" y="379.3" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：200 + JSON（no-store）</text>
<g><rect x="734.5" y="394.6" width="177.2" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="823.1" y="412.0" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：GET metric:snapshot</text>
<g><rect x="760.0" y="272.2" width="170.0" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="845.0" y="289.5" text-anchor="middle" font-size="12" fill="#2b2b2b">2.2：«create» 补齐字段</text>
<text x="40" y="624" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶三角 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="650" font-size="12.5" fill="#5a6472">降级：快照不存在、Redis 不可用或 JSON 损坏时一律返回空结构与 200，不返回 404/500；响应头带 no-store。</text>
</svg>
