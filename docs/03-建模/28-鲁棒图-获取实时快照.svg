<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-10 获取实时快照 · 鲁棒图（数据服务模块 api/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-10 主事件流 1—3；04-用例图-数据服务.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    大屏页面 @(100,250)
    actor    op2   值班员 @(100,470)
    boundary cli   :HTTP 接口 @(360,360)
    control  svc   :快照查询服务 @(700,360)
    entity   snap  :实时快照 @(1010,200)
    external cache :快照缓存 Redis @(1010,480)
  边清单
    大屏页面 → :HTTP 接口  1：GET /api/snapshot
    值班员 → :HTTP 接口  1.0：“查看看板数字”
    :HTTP 接口 → :快照查询服务  1.1：解析请求（扇形展开 -6°）
    :快照查询服务 → :快照缓存 Redis  2.1：GET metric:snapshot
    :快照查询服务 → :实时快照  2.2：«create» 补齐字段
    :快照查询服务 → :HTTP 接口  2.3：空则回空结构（扇形展开 6°）
    :快照查询服务 → :HTTP 接口  3.1：200 + JSON（no-store）（扇形展开 18°）
  覆盖：主事件流 1—3 全部活动；可选事件流 A1 / E1 / E2（快照缺失、Redis 不可用、JSON 损坏）统一走 2.3 的降级
  假设：:实时快照 取自 14-域模型；2.2 的「补齐字段」把缓存 JSON 规整为快照对象，故标 «create»
  假设：降级路径（空结构 + 200）由 2.3 回给边界，不额外画分支
-->
<rect x="0" y="0" width="1200" height="680" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-10 获取实时快照 · 鲁棒图（数据服务模块 api/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">主参与者是大屏页面（程序），次参与者是值班员（看数的人），按主/次上下分列</text>
