<path d="M708.84,312.40 L686.17,328.94 L708.84,341.94 Z" fill="#fff" stroke="#2b2b2b" stroke-width="1.8" stroke-linejoin="round"/>
<text x="700" y="430" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:快照查询服务</text>
<circle cx="1010" cy="200" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="241" x2="1044" y2="241" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="261" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:实时快照</text>
<rect x="910.0" y="443.0" width="200" height="74" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="472" text-anchor="middle" font-size="12" fill="#5a6472">«外部系统»</text>
<text x="1010" y="498" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:快照缓存 Redis</text>
<line x1="131.3" y1="263.2" x2="310.0" y2="338.8" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,338.8 L298.1,338.7 L301.6,330.4 Z" fill="#2b2b2b"/>
