<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-07 判定迟到与非法事件 · 鲁棒图（实时计算模块 stream/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-07 基本流 1—4；03-用例图-实时计算.svg（被 UC-06 include）
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    计算进程 @(100,300)
    boundary cli   :队列连接 @(360,300)
    control  svc   :事件校验服务 @(700,300)
    entity   ev    :闸机事件 @(1010,210)
    entity   win   :客流窗口 @(1010,480)
  边清单
    计算进程 → :队列连接  1：“逐条校验事件”
    :队列连接 → :事件校验服务  1.1：解析三个字段（扇形展开 -6°）
    :事件校验服务 → :闸机事件  1.2：读取字段值（扇形展开 -8.7°）
    :事件校验服务 → :闸机事件  3.1：与迟到阈值比较（扇形展开 8.7°）
    :事件校验服务 → :客流窗口  2.1：非法 / 迟到计数 +1（扇形展开 -8.7°）
    :事件校验服务 → :客流窗口  4.1：计入客流（扇形展开 8.7°）
  覆盖：基本流 1—4 全部活动；异常流 E1（时间格式非法等价于缺失）含在 1.1
  假设：UC-07 被 UC-06 include，用例图中不连参与者；此处以 UC-06 的参与者「计算进程」为触发者
  假设：「非法计数」「计入客流」是同一实体的两条不同动作，用平行线分开画
  假设：两条消息都要读事件时间，故 1.2 与 3.1 分别指向 :闸机事件 的两个字段读取
-->
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-07 判定迟到与非法事件 · 鲁棒图（实时计算模块 stream/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">计数落点是客流窗口的两个计数，不是站点；本用例被 UC-06 包含，不单独连参与者</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="271" x2="100" y2="306" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="85" y1="281" x2="115" y2="281" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="88" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="112" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b">计算进程</text>
<circle cx="360" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="280" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="300" x2="326" y2="300" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="356" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:队列连接</text>
<circle cx="700" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M663.1,274.2 A45,45 0 0 1 736.9,274.2" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M736.9,274.2 L726.9,267.8 L734.2,262.6 Z" fill="#2b2b2b"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:事件校验服务</text>
<circle cx="1010" cy="210" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="251" x2="1044" y2="251" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="271" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:闸机事件</text>
<circle cx="1010" cy="480" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="521" x2="1044" y2="521" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="541" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:客流窗口</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="393.8" y1="296.4" x2="666.2" y2="303.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.2,303.6 L655.1,307.8 L655.3,298.8 Z" fill="#2b2b2b"/>
<line x1="733.7" y1="295.6" x2="976.3" y2="214.4" stroke="#2b2b2b" stroke-width="1.8"/><path d="M976.3,214.4 L967.3,222.2 L964.4,213.7 Z" fill="#2b2b2b"/>
<line x1="730.8" y1="285.7" x2="979.2" y2="224.3" stroke="#2b2b2b" stroke-width="1.8"/><path d="M979.2,224.3 L969.6,231.3 L967.4,222.6 Z" fill="#2b2b2b"/>
<line x1="726.5" y1="321.3" x2="983.5" y2="458.7" stroke="#2b2b2b" stroke-width="1.8"/><path d="M983.5,458.7 L971.7,457.5 L975.9,449.5 Z" fill="#2b2b2b"/>
<line x1="731.6" y1="312.4" x2="978.4" y2="467.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M978.4,467.6 L966.6,465.5 L971.4,457.9 Z" fill="#2b2b2b"/>
<g><rect x="154.7" y="287.0" width="134.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“逐条校验事件”</text>
<g><rect x="468.1" y="287.0" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="530.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：解析三个字段</text>
<g><rect x="787.0" y="228.1" width="111.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="842.9" y="245.4" text-anchor="middle" font-size="12" fill="#2b2b2b">1.2：读取字段值</text>
<g><rect x="774.7" y="263.1" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="842.6" y="280.4" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：与迟到阈值比较</text>
<g><rect x="760.4" y="352.1" width="163.4" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="842.1" y="369.5" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：非法 / 迟到计数 +1</text>
<g><rect x="792.8" y="387.2" width="99.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="842.7" y="404.6" text-anchor="middle" font-size="12" fill="#2b2b2b">4.1：计入客流</text>
<text x="40" y="644" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶弧 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="670" font-size="12.5" fill="#5a6472">迟到判定阈值：事件时间早于「窗口起点减 2 个窗口」；三个计数之和与输入事件数一致（未来窗口事件除外）。</text>
</svg>
