  产物：一次刷卡数据从产生到落库 序列图（后端主链路）
  规范：se-sequence-diagram §4 符号、§5 三步转换、§6 命名与编号、references/03 固定参数
  上游：15/23/24/26-鲁棒图（对象名逐字沿用）；用例表 UC-01、UC-05、UC-06、UC-08
  覆盖：UC-01 的 5.1（写入）→ UC-05 的 2.1（取事件）→ UC-06（聚合）→ UC-08（落库）
  假设：A1 消息编号沿用各用例自身步号，用 == 分节标明属于哪个用例
  A2 上屏链路由 13 号图接力：本图写出的 metric:snapshot 就是 13 号图读取的那个键，两图不重叠
  A3 只画主路径；迟到/非法、库不可用等分支见 37、38 号图
-->
