<text x="40" y="714" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶三角 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="740" font-size="12.5" fill="#5a6472">第 6 步等待后回到第 2 步，形成循环；4.1 内含「生成 1—5 人乘客数」。下游「实时计算模块」异步消费 5.1 的事件，属 UC-05 输入，本图不画同步交互。</text>
