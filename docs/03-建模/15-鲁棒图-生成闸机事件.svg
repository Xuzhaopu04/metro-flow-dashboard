<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-01 生成闸机事件 · 鲁棒图（采集模块 simulator/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-01 基本流 1—6；02-用例图-数据采集.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    系统维护者 @(100,300)
    boundary cli   :命令行界面 @(360,300)
    control  svc   :事件生成服务 @(700,300)
    entity   st    :车站（多实例） @(1010,180)
    entity   ev    :闸机事件 @(1010,460)
    external rs    :Redis Stream @(1010,650)
  边清单
    系统维护者 → :命令行界面  1：“启动模拟器”
    :命令行界面 → :事件生成服务  1.1：解析参数（扇形展开 -6°）
    :事件生成服务 → :车站  3.1：按权重选站
    :事件生成服务 → :闸机事件  4.1：«create» 组装事件
    :事件生成服务 → :Redis Stream  5.1：XADD 写入
    :事件生成服务 → :命令行界面  5.2：打印一条日志（扇形展开 6°）
  覆盖：基本流 1—6 全部活动；备选流 A1（达量退出）见图注；异常流 E1（连不上 Redis）为一次性前置校验，未展开
  假设：补 :闸机事件 实体与 4.1 «create»（v0 缺，而第 4 步「组装成契约 2.1 的事件」必须由实体承载）
  假设：v0 的「6.1 打印日志」实属基本流第 5 步，改为 5.2
  假设：下游参与者「实时计算模块」异步消费 5.1 写入的事件，不在本次同步交互内，故不连边界
  假设：第 2 步（取当前时刻、判断时段）与第 6 步（按速率等待）是控制内部时钟与计时，不产生组件间消息
-->
