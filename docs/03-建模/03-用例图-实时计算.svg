<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="780" viewBox="0 0 1700 780" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：实时计算模块 用例图（坐标化 SVG）
  规范：se-requirements-modeling references/01（符号与关系）、references/06 §1–§2（阈值与分区）
  对应：docs/01-需求/用例表.md  UC-05～UC-09
  版本：v2（2026-11-23 按规范重绘）；v1 为同目录 PlantUML 版，已废弃
  规模：5 参与者 / 5 用例，超过自动布局阈值（参与者≥4），故用坐标化 SVG
  布局分区：左 x=200 人类参与者；框内列 x=620 放主用例；中缝 x=1080 放被 include 的 UC-07；
            右 x=1560 外部系统；用例纵向间距 110~165
  节点清单
    参与者  系统维护者(L,180)  计算进程（消费者）(L,430)
            事件队列«actor»(R,300)  数据服务模块«actor»(R,560)  指标库«actor»(R,690)
    用例    UC-09(620,180)  UC-05(620,300)  UC-06(620,410)
            UC-07(1080,410, rx=150)  UC-08(620,575)
  边清单
    关联（无箭头实线）  系统维护者—UC-09；计算进程—UC-05、UC-06、UC-08；
                        事件队列—UC-05；数据服务模块—UC-08；指标库—UC-08
    依赖（虚线+开放箭头） UC-06 =«include»=> UC-07（水平）；
                        UC-08 =«include»=> UC-06（垂直向上，主用例在上）
  说明：UC-07 被 UC-06 包含，只连主用例、不连参与者（规范 A10，检查项豁免）。
-->
<defs>
  <marker id="openArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M1,1 L11,6 L1,11" fill="none" stroke="#4A6B8A" stroke-width="1.4"/>
  </marker>
</defs>
<style>
  .halo { paint-order: stroke; stroke: #FFFFFF; stroke-width: 4px; stroke-linejoin: round; }
  text { user-select: none; }
</style>
<rect x="0" y="0" width="1700" height="780" fill="#FFFFFF"/>
<rect x="320" y="90" width="1010" height="610" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="1.6"/>
<text x="825.0" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#2E5C8A">实时计算模块（stream/）</text>
<circle cx="200" cy="150" r="13" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="1.6"/><line x1="200" y1="163" x2="200" y2="186" stroke="#4A6B8A" stroke-width="1.6"/><line x1="183" y1="172" x2="217" y2="172" stroke="#4A6B8A" stroke-width="1.6"/><line x1="200" y1="186" x2="187" y2="204" stroke="#4A6B8A" stroke-width="1.6"/><line x1="200" y1="186" x2="213" y2="204" stroke="#4A6B8A" stroke-width="1.6"/>
<text x="200" y="226" text-anchor="middle" font-size="13" fill="#1F2D3D">系统维护者</text>
<circle cx="200" cy="400" r="13" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="1.6"/><line x1="200" y1="413" x2="200" y2="436" stroke="#4A6B8A" stroke-width="1.6"/><line x1="183" y1="422" x2="217" y2="422" stroke="#4A6B8A" stroke-width="1.6"/><line x1="200" y1="436" x2="187" y2="454" stroke="#4A6B8A" stroke-width="1.6"/><line x1="200" y1="436" x2="213" y2="454" stroke="#4A6B8A" stroke-width="1.6"/>
<text x="200" y="476" text-anchor="middle" font-size="13" fill="#1F2D3D">计算进程（消费者）</text>
<circle cx="1560" cy="270" r="13" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="283" x2="1560" y2="306" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1543" y1="292" x2="1577" y2="292" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="306" x2="1547" y2="324" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="306" x2="1573" y2="324" stroke="#4A6B8A" stroke-width="1.6"/>
<text x="1560" y="346" text-anchor="middle" font-size="13" fill="#1F2D3D">事件队列</text><text x="1560" y="363" text-anchor="middle" font-size="12" font-style="italic" fill="#5A6472">«actor» Redis Stream</text>
<circle cx="1560" cy="530" r="13" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="543" x2="1560" y2="566" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1543" y1="552" x2="1577" y2="552" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="566" x2="1547" y2="584" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="566" x2="1573" y2="584" stroke="#4A6B8A" stroke-width="1.6"/>
<text x="1560" y="606" text-anchor="middle" font-size="13" fill="#1F2D3D">数据服务模块</text><text x="1560" y="623" text-anchor="middle" font-size="12" font-style="italic" fill="#5A6472">«actor» 下游</text>
<circle cx="1560" cy="660" r="13" fill="#FFFFFF" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="673" x2="1560" y2="696" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1543" y1="682" x2="1577" y2="682" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="696" x2="1547" y2="714" stroke="#4A6B8A" stroke-width="1.6"/><line x1="1560" y1="696" x2="1573" y2="714" stroke="#4A6B8A" stroke-width="1.6"/>
<text x="1560" y="736" text-anchor="middle" font-size="13" fill="#1F2D3D">指标库</text><text x="1560" y="753" text-anchor="middle" font-size="12" font-style="italic" fill="#5A6472">«actor» MySQL</text>
<ellipse cx="620" cy="180" rx="130" ry="34" fill="#F4F8FD" stroke="#4A6B8A" stroke-width="1.4"/>
<text x="620" y="185" text-anchor="middle" font-size="14" fill="#1F2D3D">UC-09: 重启后续消费</text>
<ellipse cx="620" cy="300" rx="130" ry="34" fill="#F4F8FD" stroke="#4A6B8A" stroke-width="1.4"/>
<text x="620" y="305" text-anchor="middle" font-size="14" fill="#1F2D3D">UC-05: 消费事件</text>
<ellipse cx="620" cy="410" rx="130" ry="34" fill="#F4F8FD" stroke="#4A6B8A" stroke-width="1.4"/>
<text x="620" y="415" text-anchor="middle" font-size="14" fill="#1F2D3D">UC-06: 窗口聚合出指标</text>
<ellipse cx="1080" cy="410" rx="150" ry="34" fill="#F4F8FD" stroke="#4A6B8A" stroke-width="1.4"/>
<text x="1080" y="415" text-anchor="middle" font-size="14" fill="#1F2D3D">UC-07: 判定迟到与非法事件</text>
<ellipse cx="620" cy="575" rx="130" ry="34" fill="#F4F8FD" stroke="#4A6B8A" stroke-width="1.4"/>
<text x="620" y="580" text-anchor="middle" font-size="14" fill="#1F2D3D">UC-08: 写快照与写入数据库</text>
<line x1="216" y1="180" x2="490" y2="180" stroke="#4A6B8A" stroke-width="1.3"/>
<line x1="216" y1="422" x2="490" y2="306" stroke="#4A6B8A" stroke-width="1.3"/>
<line x1="216" y1="424" x2="490" y2="410" stroke="#4A6B8A" stroke-width="1.3"/>
<line x1="216" y1="442" x2="490" y2="570" stroke="#4A6B8A" stroke-width="1.3"/>
<line x1="1542" y1="300" x2="750" y2="300" stroke="#4A6B8A" stroke-width="1.3"/>
<line x1="1542" y1="560" x2="750" y2="570" stroke="#4A6B8A" stroke-width="1.3"/>
<line x1="1542" y1="682" x2="750" y2="584" stroke="#4A6B8A" stroke-width="1.3"/>
<line x1="750" y1="410" x2="930" y2="410" stroke="#4A6B8A" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#openArrow)"/>
<text x="790" y="400" text-anchor="start" font-size="12" fill="#2E5C8A" class="halo">«include»</text>
<line x1="620" y1="541" x2="620" y2="444" stroke="#4A6B8A" stroke-width="1.3" stroke-dasharray="7,5" marker-end="url(#openArrow)"/>
<text x="636" y="497" text-anchor="start" font-size="12" fill="#2E5C8A" class="halo">«include»</text>
<text x="40" y="745" font-size="12.5" fill="#5A6472" class="halo">图注：UC-06 必须判定迟到与非法事件才能完成聚合，故「UC-07」由 UC-06 包含；被包含的 UC-07 只连主用例、不连参与者（规范 A10）。所有关联为无箭头实线，不表示数据流向。</text>
</svg>
