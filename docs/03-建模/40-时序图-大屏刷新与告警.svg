<svg xmlns="http://www.w3.org/2000/svg" width="954" height="1037" viewBox="0 0 954 1037">
<!--
  产物头（由同名 .puml 的头部注释原样带入）
  产物：UC-14 查看实时客流 + UC-17 接收客流告警 序列图（时序图）
  规范：se-sequence-diagram §4 符号、§5 三步转换、§6 命名与编号、references/03 固定参数
  上游：32-鲁棒图-查看实时客流.svg、35-鲁棒图-接收客流告警.svg（对象名逐字沿用）；用例表 UC-14 / UC-17
  覆盖：UC-14 基本流 1—3；UC-17 基本流 1—3（以 opt 片段挂在同一个每秒轮询里）
  假设：A1 UC-17 是 UC-14 的扩展，扩展点为「总客流超阈值」，故嵌在 2.1 之后
  A2 阈值是前端常量、不是域对象，故本图不含对应实体（与 35 号鲁棒图一致）
  A3 请求失败的那条支路只留一句转交，具体交互见 41 号图（UC-18）
-->
