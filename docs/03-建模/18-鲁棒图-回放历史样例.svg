<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-04 回放历史样例 · 鲁棒图
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-04 基本流 1—4；02-用例图-数据采集.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    系统维护者 @(100,300)
    boundary cli   :命令行界面 @(360,300)
    control  svc   :回放服务 @(700,300)
    entity   ev    :闸机事件（多实例） @(1010,200)
    external rs    :Redis Stream @(1010,540)
  边清单
    系统维护者 → :命令行界面  1：“回放样例”
    :命令行界面 → :回放服务  1.1：传入样例路径（扇形展开 -6°）
    :回放服务 → :闸机事件  2.1：读取全部事件（扇形展开 -8.7°）
    :回放服务 → :闸机事件  3.1：读事件时间算等待（扇形展开 8.7°）
    :回放服务 → :Redis Stream  4.1：逐条写入
    :回放服务 → :命令行界面  4.2：打印进度（扇形展开 6°）
  覆盖：基本流 1—4 全部活动；异常流 E1（样例为空）、E2（某行非合法 JSON）在读文件阶段失败
  假设：控制拆成 :回放服务（回放侧）与 :事件生成服务（实时侧），此图只画前者
  假设：补第 3 步「按事件时间差与倍速算等待时长」（v0 缺），它要读事件时间，故落在 :闸机事件 上
  假设：v0 的「5.1 打印进度」在用例表里没有第 5 步，改挂 4.2
-->
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-04 回放历史样例 · 鲁棒图</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">回放与实时生成是两条独立入口，失败语义不同，故单独拆出「回放服务」</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="271" x2="100" y2="306" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="85" y1="281" x2="115" y2="281" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="88" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="112" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b">系统维护者</text>
<circle cx="360" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="280" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="300" x2="326" y2="300" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="356" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:命令行界面</text>
<path d="M686.17,268.94 A34,34 0 1 0 708.84,267.17" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M708.84,252.40 L686.17,268.94 L708.84,281.94 Z" fill="#fff" stroke="#2b2b2b" stroke-width="1.8" stroke-linejoin="round"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:回放服务</text>
<circle cx="1018" cy="208" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="984" y1="249" x2="1052" y2="249" stroke="#2b2b2b" stroke-width="1.8"/>
<circle cx="1010" cy="200" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="241" x2="1044" y2="241" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="269" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:闸机事件</text>
<text x="1010" y="287" text-anchor="middle" font-size="12" fill="#5a6472">多实例 · 样例 JSONL</text>
<rect x="910.0" y="503.0" width="200" height="74" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="532" text-anchor="middle" font-size="12" fill="#5a6472">«外部系统»</text>
<text x="1010" y="558" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:Redis Stream</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="393.8" y1="303.6" x2="666.2" y2="296.4" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.2,296.4 L655.3,301.2 L655.1,292.2 Z" fill="#2b2b2b"/>
<line x1="666.2" y1="296.4" x2="393.8" y2="303.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M393.8,303.6 L404.7,298.8 L404.9,307.8 Z" fill="#2b2b2b"/>
<line x1="733.6" y1="294.6" x2="976.4" y2="205.4" stroke="#2b2b2b" stroke-width="1.8"/><path d="M976.4,205.4 L967.7,213.4 L964.6,205.0 Z" fill="#2b2b2b"/>
<line x1="730.4" y1="284.8" x2="979.6" y2="215.2" stroke="#2b2b2b" stroke-width="1.8"/><path d="M979.6,215.2 L970.2,222.5 L967.8,213.8 Z" fill="#2b2b2b"/>
<line x1="726.9" y1="320.8" x2="962.2" y2="503.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M962.2,503.0 L950.8,499.8 L956.3,492.7 Z" fill="#2b2b2b"/>
<g><rect x="166.7" y="287.0" width="110.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“回放样例”</text>
<g><rect x="454.5" y="269.4" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="516.4" y="286.7" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：传入样例路径</text>
<g><rect x="534.6" y="303.6" width="99.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="584.5" y="320.9" text-anchor="middle" font-size="12" fill="#2b2b2b">4.2：打印进度</text>
<g><rect x="781.0" y="223.5" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="842.9" y="240.8" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：读取全部事件</text>
<g><rect x="768.6" y="258.5" width="147.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="842.5" y="275.8" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：读事件时间算等待</text>
<g><rect x="794.6" y="398.9" width="99.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="844.5" y="416.2" text-anchor="middle" font-size="12" fill="#2b2b2b">4.1：逐条写入</text>
<text x="40" y="644" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶三角 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="670" font-size="12.5" fill="#5a6472">样例路径由参数 replay 给定。样例时间戳整体平移到当前时间、保留相对间隔；样例为空或某行非法时提示后结束。下游异步消费者不在本图（同图 15）。</text>
</svg>
