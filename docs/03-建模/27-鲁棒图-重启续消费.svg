<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-09 重启后续消费 · 鲁棒图（实时计算模块 stream/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-09 基本流 1—4；03-用例图-实时计算.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    系统维护者 @(100,300)
    boundary cli   :命令行界面 @(360,300)
    control  svc   :消费调度服务 @(700,300)
    entity   win   :客流窗口 @(1010,200)
    external rs    :事件队列 Redis Stream @(1010,480)
  边清单
    系统维护者 → :命令行界面  1：“重启消费进程”
    :命令行界面 → :消费调度服务  1.1：加入同一消费组（扇形展开 -6°）
    :消费调度服务 → :事件队列 Redis Stream  2.1：读组内确认位置（扇形展开 -9.3°）
    :消费调度服务 → :事件队列 Redis Stream  3.1：只取未确认消息（扇形展开 7.3°）
    :消费调度服务 → :客流窗口  4.1：重新聚合写入
  覆盖：基本流 1—4 全部活动；备选流 A1（重启期间新消息按正常路径消费）见图注
  假设：参与者取系统维护者（重启动作的发起者）；「计算进程（经 UC-05 参与）」不单独连线，与用例图 03 的 A10 豁免一致
  假设：「读确认位置」与「只取未确认消息」都落在事件队列上，用平行线分开
-->
<rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-09 重启后续消费 · 鲁棒图（实时计算模块 stream/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">续消费靠消费组的确认位置，不靠应用侧记录；防重靠唯一键，不靠内存去重</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="271" x2="100" y2="306" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="85" y1="281" x2="115" y2="281" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="88" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="112" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b">系统维护者</text>
<circle cx="360" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="280" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="300" x2="326" y2="300" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="356" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:命令行界面</text>
<path d="M686.17,268.94 A34,34 0 1 0 708.84,267.17" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M708.84,252.40 L686.17,268.94 L708.84,281.94 Z" fill="#fff" stroke="#2b2b2b" stroke-width="1.8" stroke-linejoin="round"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:消费调度服务</text>
<circle cx="1010" cy="200" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="241" x2="1044" y2="241" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="261" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:客流窗口</text>
<rect x="910.0" y="443.0" width="200" height="74" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="472" text-anchor="middle" font-size="12" fill="#5a6472">«外部系统»</text>
<text x="1010" y="498" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:事件队列 Redis Stream</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="393.8" y1="296.4" x2="666.2" y2="303.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.2,303.6 L655.1,307.8 L655.3,298.8 Z" fill="#2b2b2b"/>
<line x1="726.3" y1="321.6" x2="965.0" y2="443.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M965.0,443.0 L953.2,442.0 L957.3,434.0 Z" fill="#2b2b2b"/>
<line x1="731.3" y1="313.2" x2="922.2" y2="443.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M922.2,443.0 L910.5,440.5 L915.6,433.1 Z" fill="#2b2b2b"/>
<line x1="732.4" y1="289.6" x2="977.6" y2="210.4" stroke="#2b2b2b" stroke-width="1.8"/><path d="M977.6,210.4 L968.6,218.1 L965.8,209.5 Z" fill="#2b2b2b"/>
<g><rect x="154.7" y="287.0" width="134.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“重启消费进程”</text>
<g><rect x="462.1" y="287.0" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="530.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：加入同一消费组</text>
<g><rect x="768.2" y="346.4" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="836.1" y="363.8" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：读组内确认位置</text>
<g><rect x="770.3" y="390.9" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="838.2" y="408.2" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：只取未确认消息</text>
<g><rect x="793.1" y="237.0" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="254.3" text-anchor="middle" font-size="12" fill="#2b2b2b">4.1：重新聚合写入</text>
<text x="40" y="644" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶三角 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="670" font-size="12.5" fill="#5a6472">备选流 A1：重启期间到达的新消息按正常路径消费；异常流 E1：停机超过快照有效期时页面先显示暂无数据，恢复后自动续上。</text>
</svg>
