<circle cx="700" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M663.1,274.2 A45,45 0 0 1 736.9,274.2" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M736.9,274.2 L726.9,267.8 L734.2,262.6 Z" fill="#2b2b2b"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:页面渲染服务</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="393.8" y1="303.6" x2="666.2" y2="296.4" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.2,296.4 L655.3,301.2 L655.1,292.2 Z" fill="#2b2b2b"/>
<line x1="666.2" y1="296.4" x2="393.8" y2="303.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M393.8,303.6 L404.7,298.8 L404.9,307.8 Z" fill="#2b2b2b"/>
<g><rect x="148.7" y="287.0" width="146.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“打开看板根路径”</text>
<g><rect x="471.9" y="269.4" width="89.0" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="516.4" y="286.7" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：请求 /</text>
<g><rect x="455.0" y="304.7" width="171.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="540.9" y="322.0" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：返回页面模板（同源）</text>
<text x="40" y="464" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶弧 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="490" font-size="12.5" fill="#5a6472">可选事件流 A1：CDN 不可达时图表区不渲染，顶部数字仍可显示；E1：模板语法错误返回 500。CDN 未列入用例图，未画。</text>
</svg>
