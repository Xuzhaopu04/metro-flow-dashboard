<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-13 渲染大屏页面 · 鲁棒图（数据服务模块 api/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-13 主事件流 1—3；04-用例图-数据服务.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    值班员 @(100,300)
    boundary cli   :HTTP 接口 @(360,300)
    control  svc   :页面渲染服务 @(700,300)
  边清单
    值班员 → :HTTP 接口  1：“打开看板根路径”
    :HTTP 接口 → :页面渲染服务  1.1：请求 /（扇形展开 -6°）
    :页面渲染服务 → :HTTP 接口  2.1：返回页面模板（同源）（扇形展开 6°）
  覆盖：主事件流 1—3 全部活动；可选事件流 A1（CDN 不可达）与 E1（模板语法错误）见图注
  假设：不设实体：本用例的输出是页面模板，不是域模型中的持久化概念，按「不编造实体」原则留空
  假设：CDN 未在 04-用例图中列为外部系统，本图不擅自引入，只在图注说明
-->
<rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-13 渲染大屏页面 · 鲁棒图（数据服务模块 api/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">页面与接口同源，省掉跨域配置；本用例 include UC-10，快照取值不在此重复</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
