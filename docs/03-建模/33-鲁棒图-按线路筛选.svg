<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-15 按线路筛选 · 鲁棒图（可视化展示模块 web/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-15 基本流 1—3；05-用例图-可视化展示.svg（extend UC-14）
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    值班员 @(100,300)
    boundary cli   :大屏页面 @(360,300)
    control  svc   :筛选控制器 @(700,300)
    entity   line  :线路 @(1010,180)
    entity   st    :车站 @(1010,430)
  边清单
    值班员 → :大屏页面  1：“点击 1 号线 / 全部”
    :大屏页面 → :筛选控制器  1.1：切换线路条件（扇形展开 -6°）
    :筛选控制器 → :线路  2.1：取线路下站点
    :筛选控制器 → :车站  2.2：按线路过滤集合
    :筛选控制器 → :大屏页面  3.1：传给柱状图重绘（扇形展开 6°）
  覆盖：基本流 1—3 全部活动；备选流 A1（某线路无数据）含在 3.1
  假设：本用例是 UC-14 的扩展，扩展点在「站点明细已更新」之后；不产生新的接口调用
  假设：:线路 与 :车站 取自 14-域模型，「1 条线路含 0..* 车站」
-->
<rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-15 按线路筛选 · 鲁棒图（可视化展示模块 web/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">筛选是本地过滤，不新增请求；过滤键是线路，过滤对象是站点集合</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="271" x2="100" y2="306" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="85" y1="281" x2="115" y2="281" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="88" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="112" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b">值班员</text>
<circle cx="360" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="280" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="300" x2="326" y2="300" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="356" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:大屏页面</text>
<circle cx="700" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M663.1,274.2 A45,45 0 0 1 736.9,274.2" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M736.9,274.2 L726.9,267.8 L734.2,262.6 Z" fill="#2b2b2b"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:筛选控制器</text>
<circle cx="1010" cy="180" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="221" x2="1044" y2="221" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="241" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:线路</text>
<circle cx="1010" cy="430" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="471" x2="1044" y2="471" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="491" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:车站</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="393.8" y1="303.6" x2="666.2" y2="296.4" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.2,296.4 L655.3,301.2 L655.1,292.2 Z" fill="#2b2b2b"/>
<line x1="666.2" y1="296.4" x2="393.8" y2="303.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M393.8,303.6 L404.7,298.8 L404.9,307.8 Z" fill="#2b2b2b"/>
<line x1="731.7" y1="287.7" x2="978.3" y2="192.3" stroke="#2b2b2b" stroke-width="1.8"/><path d="M978.3,192.3 L969.7,200.4 L966.4,192.0 Z" fill="#2b2b2b"/>
<line x1="731.4" y1="313.1" x2="978.6" y2="416.9" stroke="#2b2b2b" stroke-width="1.8"/><path d="M978.6,416.9 L966.8,416.7 L970.2,408.4 Z" fill="#2b2b2b"/>
<g><rect x="134.9" y="287.0" width="174.2" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“点击 1 号线 / 全部”</text>
<g><rect x="454.5" y="269.4" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="516.4" y="286.7" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：切换线路条件</text>
<g><rect x="516.6" y="303.6" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="584.5" y="320.9" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：传给柱状图重绘</text>
<g><rect x="793.1" y="227.0" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="244.3" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：取线路下站点</text>
<g><rect x="777.2" y="347.9" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="845.1" y="365.2" text-anchor="middle" font-size="12" fill="#2b2b2b">2.2：按线路过滤集合</text>
<text x="40" y="584" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶弧 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="610" font-size="12.5" fill="#5a6472">备选流 A1：某线路当前无数据时图表为空但保留坐标轴；筛选状态在下次刷新后保持。</text>
</svg>
