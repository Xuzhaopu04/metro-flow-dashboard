<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-16 查看趋势与排行 · 鲁棒图（可视化展示模块 web/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-16 基本流 1—3；05-用例图-可视化展示.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    值班主管 @(100,300)
    boundary cli   :大屏页面 @(360,300)
    control  svc   :趋势面板控制器 @(700,300)
    entity   win   :客流窗口 @(1010,170)
    entity   st    :车站 @(1010,400)
    external api   :数据服务模块 @(1010,620)
  边清单
    值班主管 → :大屏页面  1：“查看趋势与排行”
    :大屏页面 → :趋势面板控制器  1.1：每 5 秒请求序列与排行（扇形展开 -6°）
    :趋势面板控制器 → :数据服务模块  1.2：GET /api/series、/api/rank
    :趋势面板控制器 → :客流窗口  2.1：渲染趋势折线
    :趋势面板控制器 → :车站  2.2：渲染排行列表
  覆盖：基本流 1—3 全部活动；备选流 A1（历史接口失败保留上一轮图形）见图注
  假设：趋势与排行分别落在 :客流窗口 与 :车站 上，两者与柱状图共用「最近 5 分钟」窗口
  假设：5 秒节拍属控制内部计时，不产生组件间消息
-->
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-16 查看趋势与排行 · 鲁棒图（可视化展示模块 web/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">一个面板两个视图：折线取窗口序列，列表取站点排行，共用同一口径</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="271" x2="100" y2="306" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="85" y1="281" x2="115" y2="281" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="88" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="112" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b">值班主管</text>
<circle cx="360" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="280" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="300" x2="326" y2="300" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="356" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:大屏页面</text>
<path d="M686.17,268.94 A34,34 0 1 0 708.84,267.17" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M708.84,252.40 L686.17,268.94 L708.84,281.94 Z" fill="#fff" stroke="#2b2b2b" stroke-width="1.8" stroke-linejoin="round"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:趋势面板控制器</text>
<circle cx="1010" cy="170" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="211" x2="1044" y2="211" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="231" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:客流窗口</text>
<circle cx="1010" cy="400" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="441" x2="1044" y2="441" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="461" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:车站</text>
<rect x="910.0" y="583.0" width="200" height="74" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="612" text-anchor="middle" font-size="12" fill="#5a6472">«外部系统»</text>
<text x="1010" y="638" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:数据服务模块</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="393.8" y1="296.4" x2="666.2" y2="303.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.2,303.6 L655.1,307.8 L655.3,298.8 Z" fill="#2b2b2b"/>
<line x1="723.7" y1="324.4" x2="974.2" y2="583.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M974.2,583.0 L963.3,578.2 L969.7,572.0 Z" fill="#2b2b2b"/>
<line x1="731.4" y1="286.9" x2="978.6" y2="183.1" stroke="#2b2b2b" stroke-width="1.8"/><path d="M978.6,183.1 L970.2,191.6 L966.8,183.3 Z" fill="#2b2b2b"/>
<line x1="732.4" y1="310.4" x2="977.6" y2="389.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M977.6,389.6 L965.8,390.5 L968.6,381.9 Z" fill="#2b2b2b"/>
<g><rect x="148.7" y="287.0" width="146.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“查看趋势与排行”</text>
<g><rect x="440.2" y="287.0" width="179.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="530.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：每 5 秒请求序列与排行</text>
<g><rect x="737.8" y="440.7" width="222.2" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="848.9" y="458.0" text-anchor="middle" font-size="12" fill="#2b2b2b">1.2：GET /api/series、/api/rank</text>
<g><rect x="793.1" y="222.0" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="239.3" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：渲染趋势折线</text>
<g><rect x="783.3" y="333.8" width="123.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="845.2" y="351.2" text-anchor="middle" font-size="12" fill="#2b2b2b">2.2：渲染排行列表</text>
<text x="40" y="704" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶三角 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="730" font-size="12.5" fill="#5a6472">备选流 A1：历史接口失败时保留上一轮图形，不打断主看板；趋势时间窗固定为最近 5 分钟。</text>
</svg>
