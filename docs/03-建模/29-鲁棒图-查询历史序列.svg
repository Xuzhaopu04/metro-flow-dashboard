<line x1="666.2" y1="356.4" x2="393.8" y2="363.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M393.8,363.6 L404.7,358.8 L404.9,367.8 Z" fill="#2b2b2b"/>
<line x1="729.0" y1="342.2" x2="981.0" y2="187.8" stroke="#2b2b2b" stroke-width="1.8"/><path d="M981.0,187.8 L974.0,197.4 L969.3,189.7 Z" fill="#2b2b2b"/>
<line x1="733.2" y1="367.5" x2="976.8" y2="422.5" stroke="#2b2b2b" stroke-width="1.8"/><path d="M976.8,422.5 L965.1,424.5 L967.1,415.7 Z" fill="#2b2b2b"/>
<line x1="724.4" y1="383.6" x2="971.8" y2="623.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M971.8,623.0 L960.7,618.6 L967.0,612.1 Z" fill="#2b2b2b"/>
<g><rect x="151.9" y="288.0" width="137.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="220.7" y="305.4" text-anchor="middle" font-size="12" fill="#2b2b2b">1：GET /api/series</text>
<g><rect x="146.8" y="406.0" width="147.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="220.7" y="423.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.0：“查看趋势折线”</text>
<g><rect x="409.2" y="329.4" width="214.4" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="516.4" y="346.7" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：解析 minutes / station_id</text>
<g><rect x="491.6" y="363.9" width="164.0" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="573.6" y="381.2" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：400 INVALID_PARAM</text>
<g><rect x="787.1" y="252.0" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="269.3" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：按时间范围过滤</text>
<g><rect x="789.4" y="379.8" width="111.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="845.3" y="397.1" text-anchor="middle" font-size="12" fill="#2b2b2b">3.2：按站点过滤</text>
<g><rect x="780.2" y="490.3" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="848.1" y="507.6" text-anchor="middle" font-size="12" fill="#2b2b2b">4.1：按时间聚合升序</text>
<text x="40" y="744" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶弧 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="770" font-size="12.5" fill="#5a6472">可选事件流 A2：时间范围内无数据时返回空 points 与 200；E1：参数越界返回 400 INVALID_PARAM 并带上收到的值。</text>
</svg>
