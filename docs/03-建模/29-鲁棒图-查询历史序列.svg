<line x1="100" y1="476" x2="88" y2="497" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="476" x2="112" y2="497" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="522" text-anchor="middle" font-size="13" fill="#2b2b2b">大屏页面</text>
<circle cx="360" cy="360" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="340" x2="310" y2="380" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="360" x2="326" y2="360" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="416" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:HTTP 接口</text>
<circle cx="700" cy="360" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M663.1,334.2 A45,45 0 0 1 736.9,334.2" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M736.9,334.2 L726.9,327.8 L734.2,322.6 Z" fill="#2b2b2b"/>
<text x="700" y="430" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:序列查询服务</text>
<circle cx="1010" cy="170" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="211" x2="1044" y2="211" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="231" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:客流窗口</text>
<circle cx="1010" cy="430" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="471" x2="1044" y2="471" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="491" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:车站</text>
<rect x="910.0" y="623.0" width="200" height="74" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="652" text-anchor="middle" font-size="12" fill="#5a6472">«外部系统»</text>
<text x="1010" y="678" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:指标库 MySQL</text>
