<line x1="100" y1="256" x2="112" y2="277" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="302" text-anchor="middle" font-size="13" fill="#2b2b2b">值班主管</text>
<circle cx="100" cy="430" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="441" x2="100" y2="476" stroke="#2b2b2b" stroke-width="1.8"/>
