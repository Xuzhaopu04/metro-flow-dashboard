<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-11 查询历史序列 · 鲁棒图（数据服务模块 api/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-11 主事件流 1—4；04-用例图-数据服务.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    值班主管 @(100,250)
    actor    op2   大屏页面 @(100,470)
    boundary cli   :HTTP 接口 @(360,360)
    control  svc   :序列查询服务 @(700,360)
    entity   win   :客流窗口 @(1010,170)
    entity   st    :车站 @(1010,430)
    external db    :指标库 MySQL @(1010,660)
  边清单
    值班主管 → :HTTP 接口  1：GET /api/series
    大屏页面 → :HTTP 接口  1.0：“查看趋势折线”
    :HTTP 接口 → :序列查询服务  1.1：解析 minutes / station_id（扇形展开 -6°）
    :序列查询服务 → :HTTP 接口  2.1：400 INVALID_PARAM（扇形展开 6°）
    :序列查询服务 → :客流窗口  3.1：按时间范围过滤
    :序列查询服务 → :车站  3.2：按站点过滤
    :序列查询服务 → :指标库 MySQL  4.1：按时间聚合升序
  覆盖：主事件流 1—4 全部活动；可选事件流 A1（不传站点即全站汇总）含在 3.2；E1（参数非法）为 2.1
  假设：:客流窗口 与 :车站 均取自 14-域模型，分别承载时间维度与站点维度
  假设：两条过滤条件对同一查询生效，按 3.1 / 3.2 分开编号，便于与用例表逐步对照
-->
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-11 查询历史序列 · 鲁棒图（数据服务模块 api/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">站点过滤条件落在 :车站 上，时间范围过滤落在 :客流窗口 上，各管一段</text>
<circle cx="100" cy="210" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="221" x2="100" y2="256" stroke="#2b2b2b" stroke-width="1.8"/>
