<svg xmlns="http://www.w3.org/2000/svg" width="1499" height="1240" viewBox="0 0 1499 1240">
<!--
  产物头（由同名 .puml 的头部注释原样带入）
  产物：UC-06 窗口聚合出指标 + UC-08 写快照与写入数据库 序列图（时序图）
  规范：se-sequence-diagram §4 符号、§5 三步转换、§6 命名与编号、references/03 固定参数
  上游：24-鲁棒图-窗口聚合.svg、26-鲁棒图-写快照与写库.svg（对象名逐字沿用）；用例表 UC-06 / UC-08
  覆盖：UC-06 基本流 1—6；UC-08 基本流 1—4
  假设：A1 UC-06 的产出直接交给 UC-08：两段用 == 分节，跨节处是一次控制到控制的调用
  A2 UC-06 备选流 A1（无有效事件仍产出全 0 指标）与 UC-08 异常流 E1（库不可用只告警一次）用 alt 表达
  A3 2.1 对齐整秒、4.1 暂存后续窗口事件为控制内部计算，不画消息，只在图注说明
-->
