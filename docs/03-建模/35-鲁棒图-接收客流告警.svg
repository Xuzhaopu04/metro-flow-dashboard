<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-17 接收客流告警 · 鲁棒图（可视化展示模块 web/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-17 基本流 1—3；05-用例图-可视化展示.svg（extend UC-14）
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    值班员 @(100,300)
    boundary cli   :大屏页面 @(360,300)
    control  svc   :告警判定 @(700,300)
    entity   snap  :实时快照 @(1010,260)
  边清单
    值班员 → :大屏页面  1：“值守查看告警”
    :大屏页面 → :告警判定  1.1：拿到快照后比较阈值（扇形展开 -6°）
    :告警判定 → :实时快照  1.2：读总客流
    :告警判定 → :大屏页面  2.1：显示红色横幅（扇形展开 6°）
    :告警判定 → :大屏页面  3.1：回落后自动隐藏（扇形展开 14.7°）
  覆盖：基本流 1—3 全部活动；备选流 A1（阈值为前端常量）即 2.2
  假设：不建「告警规则」实体：阈值当前是前端常量（用例表 UC-17 备选流 A1），还不是业务对象
  假设：与 14-域模型 的假设 A2 保持一致：一旦配置化再补「告警规则」「告警事件」两类
  假设：本用例是 UC-14 的扩展，扩展点为「总客流超阈值」，插入在 2.1 之后
-->
<rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-17 接收客流告警 · 鲁棒图（可视化展示模块 web/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">阈值是前端常量、还没配置化，故不建「告警规则」实体</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="271" x2="100" y2="306" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="85" y1="281" x2="115" y2="281" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="88" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="112" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b">值班员</text>
<circle cx="360" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="280" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="300" x2="326" y2="300" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="356" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:大屏页面</text>
<path d="M686.17,268.94 A34,34 0 1 0 708.84,267.17" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M708.84,252.40 L686.17,268.94 L708.84,281.94 Z" fill="#fff" stroke="#2b2b2b" stroke-width="1.8" stroke-linejoin="round"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:告警判定</text>
<circle cx="1010" cy="260" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="301" x2="1044" y2="301" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="321" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:实时快照</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="394.0" y1="300.0" x2="666.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.0,300.0 L655.0,304.5 L655.0,295.5 Z" fill="#2b2b2b"/><path d="M394.0,300.0 L405.0,295.5 L405.0,304.5 Z" fill="#2b2b2b"/>
<line x1="733.7" y1="295.6" x2="976.3" y2="264.4" stroke="#2b2b2b" stroke-width="1.8"/><path d="M976.3,264.4 L965.9,270.2 L964.8,261.3 Z" fill="#2b2b2b"/>
<g><rect x="154.7" y="287.0" width="134.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“值守查看告警”</text>
<g><rect x="450.1" y="272.0" width="159.8" height="56" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="530.0" y="289.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：拿到快照后比较阈值</text>
<text x="530.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：显示红色横幅</text>
<text x="530.0" y="319.3" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：回落后自动隐藏</text>
<g><rect x="805.1" y="267.0" width="99.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="284.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.2：读总客流</text>
<text x="40" y="544" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶三角 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="570" font-size="12.5" fill="#5a6472">阈值暂为前端常量 100 人次/秒，待配置化；文案带当前值与阈值，回落到阈值以下自动消失。</text>
</svg>
