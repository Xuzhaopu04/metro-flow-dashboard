<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<!--
  产物：UC-05 消费事件 · 鲁棒图（实时计算模块 stream/）
  规范：se-robustness-diagram §4–§8；references/03（三元素几何、平行线、标签避让）
  对应：docs/01-需求/用例表.md UC-05 基本流 1—5；03-用例图-实时计算.svg 参与者
  版本：v1（2026-11-23 按 skill 重绘；v0 只有 PNG，缺源文件、结构清单与覆盖声明）
  节点清单
    actor    op    计算进程 @(100,300)
    boundary cli   :队列连接 @(360,300)
    control  svc   :消费调度服务 @(700,300)
    entity   ev    :闸机事件 @(1010,300)
    external rs    :事件队列 Redis Stream @(1010,590)
  边清单
    计算进程 → :队列连接  1：“启动消费进程”
    :队列连接 → :消费调度服务  1.1：校验连接并建组（扇形展开 -6°）
    :消费调度服务 → :事件队列 Redis Stream  1.2：XGROUP CREATE（扇形展开 -10°）
    :消费调度服务 → :事件队列 Redis Stream  2.1：XREADGROUP 读取
    :消费调度服务 → :闸机事件  3.1：«create» 解析为事件
    :消费调度服务 → :事件队列 Redis Stream  5.1：XACK 确认（扇形展开 10°）
  覆盖：基本流 1—5 全部活动；异常流 E1（消息体非法 JSON 仍要 ACK）见图注
  假设：参与者「计算进程」是程序而非人，其动作同样加引号（与图 15 一致）
  假设：边界取队列通信接口而非命令行：本用例的输入全部来自事件队列
  假设：4「交给窗口处理」由同一进程的聚合入口接管，属控制内部转交，不跨控制连线
-->
<rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
<text x="40" y="46" font-size="19" font-weight="700" fill="#1f2d3d">UC-05 消费事件 · 鲁棒图（实时计算模块 stream/）</text>
<text x="40" y="72" font-size="12.5" fill="#5a6472">消费组 metric_builder 隔离多进程；边界取「队列连接」，即与事件队列的通信接口</text>
<circle cx="100" cy="260" r="11" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="271" x2="100" y2="306" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="85" y1="281" x2="115" y2="281" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="88" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="100" y1="306" x2="112" y2="327" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="100" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b">计算进程</text>
<circle cx="360" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="280" x2="310" y2="320" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="310" y1="300" x2="326" y2="300" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="360" y="356" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:队列连接</text>
<circle cx="700" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M663.1,274.2 A45,45 0 0 1 736.9,274.2" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
<path d="M736.9,274.2 L726.9,267.8 L734.2,262.6 Z" fill="#2b2b2b"/>
<text x="700" y="370" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:消费调度服务</text>
<circle cx="1010" cy="300" r="34" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<line x1="976" y1="341" x2="1044" y2="341" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="361" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:闸机事件</text>
<text x="1010" y="379" text-anchor="middle" font-size="12" fill="#5a6472">每条消息一个实例</text>
<rect x="910.0" y="553.0" width="200" height="74" rx="8" fill="#fff" stroke="#2b2b2b" stroke-width="1.8"/>
<text x="1010" y="582" text-anchor="middle" font-size="12" fill="#5a6472">«外部系统»</text>
<text x="1010" y="608" text-anchor="middle" font-size="13" text-decoration="underline" fill="#2b2b2b">:事件队列 Redis Stream</text>
<line x1="134.0" y1="300.0" x2="310.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M310.0,300.0 L299.0,304.5 L299.0,295.5 Z" fill="#2b2b2b"/>
<line x1="393.8" y1="296.4" x2="666.2" y2="303.6" stroke="#2b2b2b" stroke-width="1.8"/><path d="M666.2,303.6 L655.1,307.8 L655.3,298.8 Z" fill="#2b2b2b"/>
<line x1="724.8" y1="323.2" x2="970.4" y2="553.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M970.4,553.0 L959.3,548.8 L965.5,542.2 Z" fill="#2b2b2b"/>
<line x1="734.0" y1="300.0" x2="976.0" y2="300.0" stroke="#2b2b2b" stroke-width="1.8"/><path d="M976.0,300.0 L965.0,304.5 L965.0,295.5 Z" fill="#2b2b2b"/>
<g><rect x="154.7" y="287.0" width="134.6" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="222.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1：“启动消费进程”</text>
<g><rect x="462.1" y="287.0" width="135.8" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="530.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">1.1：校验连接并建组</text>
<g><rect x="773.4" y="410.1" width="148.4" height="56" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="847.6" y="427.4" text-anchor="middle" font-size="12" fill="#2b2b2b">1.2：XGROUP CREATE</text>
<text x="847.6" y="442.4" text-anchor="middle" font-size="12" fill="#2b2b2b">2.1：XREADGROUP 读取</text>
<text x="847.6" y="457.4" text-anchor="middle" font-size="12" fill="#2b2b2b">5.1：XACK 确认</text>
<g><rect x="764.0" y="287.0" width="182.0" height="26" rx="10" fill="#fff" stroke="#c9d2dc" stroke-width="1"/></g>
<text x="855.0" y="304.3" text-anchor="middle" font-size="12" fill="#2b2b2b">3.1：«create» 解析为事件</text>
<text x="40" y="704" font-size="12" fill="#5a6472">图例：左竖线 = 边界　顶弧 = 控制　下横线 = 实体　右侧方框 = 外部系统</text>
<text x="40" y="730" font-size="12.5" fill="#5a6472">异常流 E1：消息体不是合法 JSON 时按一条非法事件处理，仍须 5.1 ACK，避免卡在待确认列表。</text>
</svg>
