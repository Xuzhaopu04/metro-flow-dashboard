<!--
  产物头（由同名 .puml 的头部注释原样带入）
  产物：UC-05 消费事件 + UC-07 判定迟到与非法 序列图（时序图）
  规范：se-sequence-diagram §4 符号、§5 三步转换、§6 命名与编号、references/03 固定参数
  上游：23-鲁棒图-消费事件.svg、25-鲁棒图-判定迟到与非法.svg（对象名逐字沿用）；用例表 UC-05 / UC-07
  覆盖：UC-05 基本流 1—5；UC-07 基本流 1—4（作为 3.2 的子交互展开，消息名前缀 UC-07/）
  假设：A1 UC-07 被 UC-06 include，此处挂在对每条消息的校验上，故用「UC-07/步号」前缀区分两套编号
  A2 消息体不是合法 JSON 时仍走 5.1 ACK（用例表 UC-05 异常流 E1），不另画分支
-->
